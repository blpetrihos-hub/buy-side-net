<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Interactive map · Commanding Heights of Latin America</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/site.css?v=fddc91747dfe5983c36d38b51a0ff15ca1761db3">
</head>
<body>
<header class="site-header site-header-compact">
  <div class="inner">
    <nav aria-label="Site">
      <a href="index.html" aria-current="page">Interactive map</a>
      <a href="methods.html">Methods</a>
      <a href="bibliography.html">Bibliography</a>
    </nav>
    <div class="header-brand">
      <p class="kicker">William &amp; Mary · GIAS Futures Group · Team 2</p>
      <h1>Commanding Heights of Latin America</h1>
      <p class="sub">PRC versus U.S. investment and presence across infrastructure, scarce natural resources, and energy.</p>
    </div>
  </div>
</header>

<main class="dash-map">
  <section class="map-hero">
    <div class="map-legend-bar" id="mapLegend"></div>
    <div class="map-stage">
      <div id="map"></div>
      <button type="button" class="panel-toggle" id="panelToggle" aria-expanded="false" aria-controls="filterOverlay">Filters</button>
      <aside class="filter-overlay" id="filterOverlay" hidden>
        <div class="overlay-head">
          <strong>Filters</strong>
          <button type="button" class="overlay-close" id="overlayClose" aria-label="Close filters">×</button>
        </div>
        <div class="layer-toggles" id="layerToggles"></div>
        <label class="ctl">Subcategory
          <select id="subcategory"><option value="all">All subcategories</option></select>
        </label>
        <label class="ctl">Country
          <select id="country"><option value="all">All countries</option></select>
        </label>
        <label class="ctl">Evidence
          <select id="evidence">
            <option value="all">All classes</option>
            <option value="paired">Paired</option>
            <option value="one_sided">One-sided</option>
            <option value="documented">Documented</option>
            <option value="proxy">Proxy</option>
            <option value="hunt">Hunt</option>
          </select>
        </label>
        <label class="ctl">Side
          <select id="side">
            <option value="all">All sides</option>
            <option value="us_prc">U.S. vs. PRC</option>
            <option value="us">U.S.</option>
            <option value="prc">PRC</option>
            <option value="allied">Allied / other</option>
          </select>
        </label>
      </aside>
    </div>
  </section>

  <div hidden aria-hidden="true">
    <p id="caption"></p><div id="layerReadouts"></div><div id="countryReadouts"></div><div id="gapReadouts"></div><ul id="listRows"></ul><p id="note"></p>
  </div>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/dashboard.js?v=fddc91747dfe5983c36d38b51a0ff15ca1761db3"></script>
</body>
</html>
